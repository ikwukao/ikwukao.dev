summary:
  title: Engineering Expertise
  description: >
    I build reliable backend systems with Go, with a focus on distributed
    systems, scalable infrastructure, platform engineering, and production
    reliability. My engineering approach emphasizes clear architecture,
    concurrency, observability, automation, and systems that remain
    maintainable as they grow.

