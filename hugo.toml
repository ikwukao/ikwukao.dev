      unsafe = true # Allows seamless rendering of strict custom architectural layouts inside MD
  [markup.highlight]
    style = "github-dark"
    lineNos = false
    noClasses = false

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

