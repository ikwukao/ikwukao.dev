{{ with resources.Get "js/search.js" }}
  {{ $search := . | js.Build | minify | fingerprint }}
  <script
    src="{{ $search.RelPermalink }}"
    integrity="{{ $search.Data.Integrity }}"
    defer>
  </script>
{{ end }}

{{ with resources.Get "js/navigation.js" }}
  {{ $nav := . | js.Build | minify | fingerprint }}
  <script
    src="{{ $nav.RelPermalink }}"
    integrity="{{ $nav.Data.Integrity }}"
    defer>
  </script>
{{ end }}
