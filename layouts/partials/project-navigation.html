<section class="border-t border-white/10 py-20">

  <div class="mx-auto flex max-w-6xl justify-between px-6">

    {{ with .PrevInSection }}

      <a
        href="{{ .RelPermalink }}"
        class="group">

        <p class="text-sm uppercase tracking-wider text-zinc-500">

          Previous Project

        </p>

        <p class="mt-2 text-lg transition group-hover:text-emerald-400">

          ← {{ .Title }}

        </p>

      </a>

    {{ end }}

    {{ with .NextInSection }}

      <a
        href="{{ .RelPermalink }}"
        class="group ml-auto text-right">

        <p class="text-sm uppercase tracking-wider text-zinc-500">

          Next Project

        </p>

        <p class="mt-2 text-lg transition group-hover:text-emerald-400">

          {{ .Title }} →

        </p>

      </a>

    {{ end }}

  </div>

</section>
