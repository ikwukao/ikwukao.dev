<div class="grid gap-8 lg:grid-cols-2">

  {{ range hugo.Data.skills.categories }}

  <article class="group rounded-2xl border border-white/10 bg-zinc-950/40 p-8 transition-all duration-300 hover:-translate-y-1 hover:border-emerald-500/40 hover:shadow-xl hover:shadow-emerald-500/5">

    <div class="flex items-start gap-4">

      <div class="skill-icon flex h-12 w-12 items-center justify-center rounded-xl border border-white/10 bg-zinc-900 text-emerald-400">

        {{ partial "icon.html" (dict
          "name" .icon
          "class" "h-6 w-6") }}

      </div>

      <div class="flex-1">

        <h2 class="text-2xl font-bold text-white">

          {{ .title }}

        </h2>

        <p class="mt-3 leading-7 text-zinc-400">

          {{ .description }}

        </p>

      </div>

    </div>

    <div class="mt-8 flex flex-wrap gap-3">

      {{ range .skills }}

      <span class="tech-pill">

        {{ .name }}

      </span>

      {{ end }}

    </div>

  </article>

  {{ end }}

</div>
