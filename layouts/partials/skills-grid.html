<section class="py-28">

  <div class="mx-auto max-w-6xl px-6">

    <div class="grid gap-8 lg:grid-cols-2">

      {{ range hugo.Data.skills.categories }}

      <article class="rounded-2xl border border-white/10 bg-zinc-950/40 p-8 transition hover:border-emerald-500/40">

        <h2 class="text-2xl font-bold text-white">

          {{ .title }}

        </h2>

        <p class="mt-4 leading-7 text-zinc-400">

          {{ .description }}

        </p>

        <div class="mt-8 flex flex-wrap gap-3">

          {{ range .skills }}

          <span class="rounded-full border border-emerald-500/20 bg-emerald-500/5 px-3 py-2 text-sm text-emerald-300">

            {{ .name }}

          </span>

          {{ end }}

        </div>

      </article>

      {{ end }}

    </div>

  </div>

</section>
