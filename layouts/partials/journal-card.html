<article class="group rounded-xl border border-white/10 bg-zinc-900/40 p-8 backdrop-blur transition-all duration-300 hover:-translate-y-1 hover:border-emerald-500/40">

  <p class="text-sm uppercase tracking-wider text-zinc-500">
    {{ .Date.Format "January 2, 2006" }} • {{ .ReadingTime }} min read
  </p>

  <h3 class="mt-4 text-2xl font-bold transition group-hover:text-emerald-400">

    <a href="{{ .RelPermalink }}">
      {{ .Title }}
    </a>

  </h3>

  <p class="mt-5 leading-8 text-zinc-400">

    {{ with .Description }}
      {{ . }}
    {{ else }}
      {{ .Summary }}
    {{ end }}

  </p>

  {{ with .Params.tags }}

  <div class="mt-6 flex flex-wrap gap-2">

    {{ range . }}

      <span class="rounded-full border border-white/10 bg-zinc-800/60 px-3 py-1 text-xs uppercase tracking-wide text-zinc-300">

        {{ . }}

      </span>

    {{ end }}

  </div>

  {{ end }}

  <a
    href="{{ .RelPermalink }}"
    class="mt-8 inline-flex text-emerald-400 transition hover:text-emerald-300">

    Read Article →

  </a>

</article>
