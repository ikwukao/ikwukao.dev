{{ with .Params.features }}

<section class="border-t border-white/10 py-24">

  <div class="mx-auto max-w-6xl px-6">

    {{ partial "section-header.html" (dict
      "title" "Key Features"
      "description" "Major capabilities of this project."
    ) }}

    <div class="mt-12 grid gap-4 md:grid-cols-2">

      {{ range . }}

      <div class="rounded-xl border border-white/10 p-5">

        <p class="text-zinc-300">

          ✓ {{ . }}

        </p>

      </div>

      {{ end }}

    </div>

  </div>

</section>

{{ end }}
