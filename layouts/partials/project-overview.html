<section class="border-t border-white/10 py-24">

  <div class="mx-auto max-w-4xl px-6">

    {{ partial "section-header.html" (dict
      "title" "Overview"
      "description" "Architecture, goals, and implementation."
    ) }}

    <div class="prose prose-invert mt-12 max-w-none">

      {{ .Content }}

    </div>

    <div class="mt-16 grid gap-6 md:grid-cols-3">

      <div class="rounded-xl border border-white/10 p-6">

        <p class="text-sm uppercase tracking-wider text-zinc-500">
          Status
        </p>

        <p class="mt-3 font-semibold text-emerald-400">

          {{ default "Active" .Params.status }}

        </p>

      </div>

      <div class="rounded-xl border border-white/10 p-6">

        <p class="text-sm uppercase tracking-wider text-zinc-500">
          Started
        </p>

        <p class="mt-3 font-semibold text-white">

          {{ .Date.Format "January 2006" }}

        </p>

      </div>

      <div class="rounded-xl border border-white/10 p-6">

        <p class="text-sm uppercase tracking-wider text-zinc-500">
          Reading Time
        </p>

        <p class="mt-3 font-semibold text-white">

          {{ .ReadingTime }} min

        </p>

      </div>

    </div>

  </div>

</section>
