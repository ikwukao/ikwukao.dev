<section class="relative overflow-hidden py-28">

  <div class="hero-bg"></div>

  <div class="mx-auto max-w-6xl px-6">

    <p class="logo mb-5 text-xl font-bold text-emerald-500">
      >_ project
    </p>

    {{ with .Params.tech }}

    <p class="mb-6 text-sm uppercase tracking-[0.25em] text-emerald-400">

      {{ delimit . " • " }}

    </p>

    {{ end }}

    <h1 class="max-w-5xl text-5xl font-bold tracking-tight text-white md:text-7xl">

      {{ .Title }}

    </h1>

    <p class="mt-8 max-w-3xl text-xl leading-8 text-zinc-400">

      {{ with .Description }}
      <p class="mt-8 max-w-3xl text-xl leading-8 text-zinc-400">
        {{ . }}
      </p>
      {{ end }}

    </p>

    <div class="mt-10 flex flex-wrap gap-3">

      {{ range .Params.tech }}

        <span class="rounded-full border border-emerald-500/20 bg-emerald-500/5 px-3 py-1 text-sm text-emerald-300">

          {{ . }}

        </span>

      {{ end }}

    </div>

    <div class="mt-12 flex flex-wrap gap-4">

      {{ with .Params.github }}

      <a
        href="{{ . }}"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-primary">

        GitHub →

      </a>

      {{ end }}

      {{ with .Params.demo }}

      <a
        href="{{ . }}"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-secondary">

        Live Demo →

      </a>

      {{ end }}

    </div>

  </div>

</section>
