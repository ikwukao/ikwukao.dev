<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<meta
  name="description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">

<meta
  name="author"
  content="{{ site.Params.author }}">

<meta
  name="robots"
  content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

<meta
  name="theme-color"
  content="#050505">

<meta
  name="color-scheme"
  content="dark">

<title>
  {{ if .IsHome }}
    {{ site.Title }} | {{ site.Params.profession }} — Distributed Systems & Platform Engineering
  {{ else }}
    {{ .Title }} | {{ site.Title }}
  {{ end }}
</title>

<link
  rel="canonical"
  href="{{ .Permalink }}">

<link
  rel="sitemap"
  type="application/xml"
  href="{{ "sitemap.xml" | absURL }}">

<!-- Open Graph -->

<meta
  property="og:type"
  content="{{ if .IsHome }}website{{ else }}article{{ end }}">

<meta
  property="og:site_name"
  content="{{ site.Title }}">

<meta
  property="og:title"
  content="{{ if .Title }}{{ .Title }} | {{ site.Title }}{{ else }}{{ site.Title }} | {{ site.Params.profession }}{{ end }}">

<meta
  property="og:description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">

<meta
  property="og:url"
  content="{{ .Permalink }}">

<meta
  property="og:locale"
  content="en_US">

{{ with .Params.image }}
<meta
  property="og:image"
  content="{{ . | absURL }}">
{{ else }}
<meta
  property="og:image"
  content="{{ "images/og-image.png" | absURL }}">
{{ end }}

<meta
  property="og:image:alt"
  content="Ikwuka Okoye — Golang Backend Engineer">

<!-- X -->

<meta
  name="twitter:card"
  content="summary_large_image">

<meta
  name="twitter:title"
  content="{{ if .Title }}{{ .Title }} | {{ site.Title }}{{ else }}{{ site.Title }} | {{ site.Params.profession }}{{ end }}">

<meta
  name="twitter:description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">

{{ with .Params.image }}
<meta
  name="twitter:image"
  content="{{ . | absURL }}">
{{ else }}
<meta
  name="twitter:image"
  content="{{ "images/og-image.png" | absURL }}">
{{ end }}

<meta
  name="twitter:image:alt"
  content="Ikwuka Okoye — Golang Backend Engineer">

<!-- Icons -->

<link
  rel="icon"
  type="image/png"
  href="/favicon-96x96.png"
  sizes="96x96">

<link
  rel="icon"
  type="image/svg+xml"
  href="/favicon.svg">

<link
  rel="shortcut icon"
  href="/favicon.ico">

<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/apple-touch-icon.png">

<meta
  name="apple-mobile-web-app-title"
  content="ikwukao.dev">

<link
  rel="manifest"
  href="/site.webmanifest">

<!-- RSS -->

{{ with .OutputFormats.Get "RSS" }}
<link
  rel="alternate"
  type="application/rss+xml"
  title="{{ site.Title }}"
  href="{{ .RelPermalink }}">
{{ end }}

<!-- DNS Prefetch -->

<link
  rel="dns-prefetch"
  href="//github.com">

<link
  rel="dns-prefetch"
  href="//x.com">

{{ partial "schema.html" . }}

<!-- Styles -->

{{ with resources.Get "css/main.css" }}
  {{ $css := . | css.TailwindCSS | minify | fingerprint }}
  <link
    rel="stylesheet"
    href="{{ $css.RelPermalink }}"
    integrity="{{ $css.Data.Integrity }}">
{{ end }}
