<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
/>

<title>
  {{ if .Title }}
    {{ .Title }} | {{ .Site.Title }}
  {{ else }}
    {{ .Site.Title }}
  {{ end }}
</title>

{{ with resources.Get "css/main.css" }}
  {{ $css := . | css.TailwindCSS }}
  <link
      rel="stylesheet"
      href="{{ $css.RelPermalink }}"
  />
{{ end }}
