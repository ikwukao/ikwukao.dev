<section class="border-t border-white/10 py-28">

  <div class="mx-auto max-w-6xl px-6">

    {{ partial "section-header.html" (dict
      "title" "Core Expertise"
      "description" "Technical skills and engineering disciplines that power the systems I build."
    ) }}

    <div class="mt-14 grid gap-6 md:grid-cols-2 lg:grid-cols-3">

      {{ range hugo.Data.skills.categories }}

        <article class="group rounded-2xl border border-white/10 bg-zinc-950/40 p-6 transition-all duration-300 hover:-translate-y-1 hover:border-emerald-500/40 hover:shadow-lg hover:shadow-emerald-500/5">

          <h3 class="text-xl font-semibold text-white">

            {{ .title }}

          </h3>

          <p class="mt-3 leading-7 text-zinc-400">

            {{ .description }}

          </p>

          <div class="mt-6 flex flex-wrap gap-2">

            {{ range .skills }}

              <span class="rounded-full border border-emerald-500/20 bg-emerald-500/5 px-3 py-1 text-sm text-emerald-300">

                {{ .name }}

              </span>

            {{ end }}

          </div>

        </article>

      {{ end }}

    </div>

  </div>

</section>
