<!-- Brand -->

<a
  href="/"
  aria-label="Go to homepage"
  class="flex items-center gap-3 transition hover:opacity-90">

  <span class="logo text-2xl font-bold text-emerald-500">
    >_
  </span>

  <div class="leading-tight">

    <p class="font-semibold tracking-tight text-white">
      ikwukao
    </p>

    <p class="hidden text-xs text-zinc-500 md:block">
      Golang Backend • Distributed Systems
    </p>

  </div>

</a>

<!-- Desktop Navigation -->

<nav
  aria-label="Primary Navigation"
  class="hidden lg:block">

  <ul class="flex items-center gap-8">

    {{ range site.Menus.main }}

    <li>

      <a
        href="{{ .URL }}"
        class="text-sm font-medium transition-colors duration-200
        {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
          text-emerald-400
        {{ else }}
          text-zinc-300 hover:text-emerald-400
        {{ end }}">

        {{ .Name }}

      </a>

    </li>

    {{ end }}

  </ul>

</nav>

<!-- Desktop Actions -->

<div class="hidden items-center gap-3 lg:flex">

  <a
    href="/search/"
    aria-label="Search"
    class="rounded-lg border border-white/10 px-4 py-2 text-sm transition hover:border-emerald-500/40 hover:text-emerald-400">

    Search

  </a>

  <a
    href="{{ site.Params.github }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="GitHub Profile"
    class="rounded-lg border border-white/10 px-4 py-2 text-sm transition hover:border-emerald-500/40 hover:text-emerald-400">

    GitHub

  </a>

</div>

<!-- Mobile Menu Button -->

<button
  id="mobile-menu-button"
  type="button"
  aria-label="Toggle navigation"
  aria-expanded="false"
  class="rounded-lg border border-white/10 p-2 text-zinc-300 transition hover:border-emerald-500/40 hover:text-emerald-400 lg:hidden">

  ☰

</button>

<!-- Mobile Navigation -->

<div
  id="mobile-menu"
  class="absolute left-0 right-0 top-full hidden border-b border-white/10 bg-black/95 backdrop-blur-lg lg:hidden">

  <nav
    aria-label="Mobile Navigation"
    class="mx-auto flex max-w-6xl flex-col px-6 py-6">

    {{ range site.Menus.main }}

    <a
      href="{{ .URL }}"
      class="border-b border-white/5 py-4 transition hover:text-emerald-400">

      {{ .Name }}

    </a>

    {{ end }}

    <a
      href="/search/"
      class="border-b border-white/5 py-4 transition hover:text-emerald-400">

      Search

    </a>

    <a
      href="{{ site.Params.github }}"
      target="_blank"
      rel="noopener noreferrer"
      class="py-4 transition hover:text-emerald-400">

      GitHub

    </a>

  </nav>

</div>
