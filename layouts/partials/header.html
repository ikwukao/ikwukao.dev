<header class="sticky top-0 z-50 border-b border-white/10 bg-black/80 backdrop-blur-xl">

  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6">

    <!-- Brand -->

    <a
      href="/"
      aria-label="Go to homepage"
      class="group flex items-center gap-3">

      <span class="logo text-2xl font-bold text-emerald-500 transition-colors group-hover:text-emerald-400">
        >_
      </span>

      <div>

        <p class="font-semibold tracking-tight text-white">
          ikwukao
        </p>

        <p class="hidden text-xs text-zinc-500 md:block">
          Golang Backend • Distributed Systems
        </p>

      </div>

    </a>

    <!-- Desktop Navigation -->

    <nav
      aria-label="Primary Navigation"
      class="hidden lg:block">

      <ul class="flex items-center gap-8">

        {{ range site.Menus.main }}

        <li>

          <a
            href="{{ .URL }}"
            class="relative text-sm font-medium transition-colors duration-200
            {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
              text-emerald-400
            {{ else }}
              text-zinc-300 hover:text-white
            {{ end }}">

            {{ .Name }}

          </a>

        </li>

        {{ end }}

      </ul>

    </nav>

    <!-- Desktop Actions -->

    <div class="hidden items-center gap-3 lg:flex">

    <a
      href="/search/"
      aria-label="Search the website"
      class="hidden items-center gap-2 rounded-xl border border-white/10 px-4 py-2 text-sm text-zinc-300 transition hover:border-emerald-500/40 hover:text-emerald-400 lg:inline-flex">

      {{ partial "icon.html" (dict
        "set" "icons/brands"
        "name" "search"
        "class" "h-4 w-4") }}

      <span>Search</span>

    </a>

      <a
        href="{{ site.Params.github }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub Profile"
        class="rounded-xl bg-emerald-500 px-4 py-2 text-sm font-medium text-black transition hover:bg-emerald-400">

        GitHub

      </a>

    </div>

    <!-- Mobile Toggle -->

    <button
      id="mobile-menu-button"
      type="button"
      aria-label="Toggle navigation"
      aria-controls="mobile-menu"
      aria-expanded="false"
      class="rounded-xl border border-white/10 p-3 transition hover:border-emerald-500 hover:text-emerald-400 lg:hidden">

      ☰

    </button>

  </div>

  <!-- Mobile Navigation -->

  <div
    id="mobile-menu"
    class="hidden border-t border-white/10 bg-zinc-950 lg:hidden">

    <nav
      aria-label="Mobile Navigation"
      class="mx-auto flex max-w-7xl flex-col px-6 py-4">

      {{ range site.Menus.main }}

      <a
        href="{{ .URL }}"
        class="border-b border-white/5 py-4 text-zinc-300 transition hover:text-emerald-400">

        {{ .Name }}

      </a>

      {{ end }}

      <a
        href="/search/"
        class="border-b border-white/5 py-4 text-zinc-300 transition hover:text-emerald-400">

        Search

      </a>

      <a
        href="{{ site.Params.github }}"
        target="_blank"
        rel="noopener noreferrer"
        class="py-4 text-zinc-300 transition hover:text-emerald-400">

        GitHub

      </a>

    </nav>

  </div>

</header>
