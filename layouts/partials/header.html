<header class="sticky top-0 z-50 border-b border-white/10 bg-black/80 backdrop-blur-md">

  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">

    <!-- Brand -->

    <a
      href="/"
      aria-label="Go to homepage"
      class="flex items-center gap-3 transition hover:opacity-90">

      <span class="logo text-xl font-bold text-emerald-500">
        >_
      </span>

      <div class="leading-tight">

        <p class="font-semibold tracking-tight text-white">
          ikwukao
        </p>

        <p class="hidden text-xs text-zinc-500 md:block">
          Golang Backend • Distributed Systems
        </p>

      </div>

    </a>

    <!-- Navigation -->

    <nav
      aria-label="Primary Navigation"
      class="hidden lg:block">

      <ul class="flex items-center gap-8">

        {{ range site.Menus.main }}

        <li>

          <a
            href="{{ .URL }}"
            class="text-sm font-medium transition-colors duration-200
            {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
              text-emerald-400
            {{ else }}
              text-zinc-300 hover:text-emerald-400
            {{ end }}">

            {{ .Name }}

          </a>

        </li>

        {{ end }}

      </ul>

    </nav>

    <!-- Actions -->

    <div class="flex items-center gap-3">

      <a
        href="/search/"
        aria-label="Search"
        class="rounded-lg border border-white/10 px-4 py-2 text-sm text-zinc-300 transition hover:border-emerald-500/40 hover:text-emerald-400">

        Search

      </a>

      <a
        href="{{ site.Params.github }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub Profile"
        class="rounded-lg border border-white/10 px-4 py-2 text-sm text-zinc-300 transition hover:border-emerald-500/40 hover:text-emerald-400">

        GitHub

      </a>

    </div>

  </div>

</header>
