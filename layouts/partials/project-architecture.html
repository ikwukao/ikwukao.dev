<section class="border-t border-white/10 py-28">

  <div class="mx-auto max-w-6xl px-6">

    {{ partial "section-header.html" (dict
      "title" "Architecture"
      "description" "A high-level view of how the system is organized."
    ) }}

    <div class="mt-16 rounded-2xl border border-white/10 bg-zinc-900/40 p-8 backdrop-blur">

      <div class="grid gap-8 text-center md:grid-cols-5">

        <div>
          <div class="rounded-xl border border-white/10 bg-zinc-950 p-6">
            Client
          </div>
        </div>

        <div class="flex items-center justify-center text-emerald-400 text-2xl">
          →
        </div>

        <div>
          <div class="rounded-xl border border-white/10 bg-zinc-950 p-6">
            Backend API
          </div>
        </div>

        <div class="flex items-center justify-center text-emerald-400 text-2xl">
          →
        </div>

        <div>
          <div class="rounded-xl border border-white/10 bg-zinc-950 p-6">
            Database
          </div>
        </div>

      </div>

      {{ with .Params.architecture }}

      <div class="prose prose-invert mt-12 max-w-none">

        {{ . | markdownify }}

      </div>

      {{ end }}

    </div>

  </div>

</section>
