{{ if or .Params.github .Params.demo }}

<section class="border-t border-white/10 py-24">

  <div class="mx-auto max-w-6xl px-6">

    {{ partial "section-header.html" (dict
      "title" "Explore Project"
      "description" "Source code and live deployment."
    ) }}

    <div class="mt-12 flex flex-wrap gap-4">

      {{ with .Params.github }}

      <a
        href="{{ . }}"
        target="_blank"
        rel="noopener"
        class="btn-primary">

        View Source →

      </a>

      {{ end }}

      {{ with .Params.demo }}

      <a
        href="{{ . }}"
        target="_blank"
        rel="noopener"
        class="btn-secondary">

        Live Demo →

      </a>

      {{ end }}

    </div>

  </div>

</section>

{{ end }}
