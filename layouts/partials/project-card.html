<article class="group flex h-full flex-col rounded-xl border border-white/10 bg-zinc-900/40 p-8 shadow-sm backdrop-blur transition-all duration-300 hover:-translate-y-1 hover:border-emerald-500/40 hover:shadow-lg hover:shadow-emerald-500/10">

  <!-- Status -->

  {{ with .Params.status }}
  <div class="mb-6">
    <span class="rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-xs font-medium uppercase tracking-wider text-emerald-400">
      {{ . }}
    </span>
  </div>
  {{ end }}

  <!-- Title -->

  <h3 class="text-2xl font-bold transition group-hover:text-emerald-400">

    <a href="{{ .RelPermalink }}">
      {{ .Title }}
    </a>

  </h3>

  <!-- Summary -->

  <p class="mt-5 grow leading-8 text-zinc-400">

    {{ with .Description }}
      {{ . }}
    {{ else }}
      {{ .Summary }}
    {{ end }}

  </p>

  <!-- Technology -->

  {{ with .Params.technologies }}

  <div class="mt-8 flex flex-wrap gap-2">

    {{ range . }}

      <span class="rounded-full border border-white/10 bg-zinc-800/60 px-3 py-1 text-xs uppercase tracking-wide text-zinc-300">

        {{ . }}

      </span>

    {{ end }}

  </div>

  {{ end }}

  <!-- Footer -->

  <div class="mt-8 flex items-center justify-between border-t border-white/10 pt-6">

    <a
      href="{{ .RelPermalink }}"
      class="font-medium text-emerald-400 transition hover:text-emerald-300">

      Read Case Study →

    </a>

    {{ with .Params.github }}

      <a
        href="{{ . }}"
        target="_blank"
        rel="noopener noreferrer"
        class="text-sm text-zinc-400 transition hover:text-white">

        Source ↗

      </a>

    {{ end }}

  </div>

</article>
