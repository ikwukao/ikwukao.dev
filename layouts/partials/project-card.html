<article class="group rounded-xl border border-white/10 bg-white/[0.02] p-6 transition duration-200 hover:-translate-y-1 hover:border-emerald-500/40">

    <div class="flex items-center justify-between">

        <h3 class="text-2xl font-semibold">

            <a href="{{ .RelPermalink }}">

                {{ .Title }}

            </a>

        </h3>

        {{ with .Params.status }}

        <span class="rounded-full border border-emerald-500/30 px-3 py-1 text-xs uppercase tracking-wider text-emerald-400">

            {{ . }}

        </span>

        {{ end }}

    </div>

    <p class="mt-5 leading-7 text-zinc-400">

        {{ .Summary }}

    </p>

    {{ with .Params.technologies }}

    <div class="mt-6 flex flex-wrap gap-2">

        {{ range . }}

        <span class="rounded-full border border-white/10 px-3 py-1 text-sm text-zinc-300">

            {{ . }}

        </span>

        {{ end }}

    </div>

    {{ end }}

    <div class="mt-8 flex gap-6">

        <a
            href="{{ .RelPermalink }}"
            class="text-emerald-400 transition hover:text-emerald-300">

            Case Study →

        </a>

        {{ with .Params.github }}

        <a
            href="{{ . }}"
            target="_blank"
            rel="noopener"
            class="text-zinc-400 transition hover:text-white">

            Source Code

        </a>

        {{ end }}

    </div>

</article>
