<article class="group rounded-xl border border-white/10 bg-white/[0.02] p-6 transition hover:border-emerald-500/50">

  <h3 class="text-2xl font-semibold text-white">
    {{ .title }}
  </h3>

  <p class="mt-4 text-zinc-400">
    {{ .description }}
  </p>

  <div class="mt-6 flex flex-wrap gap-2">
    {{ range .tech }}
      <span class="rounded-full border border-white/10 px-3 py-1 text-sm text-zinc-300">
        {{ . }}
      </span>
    {{ end }}
  </div>

  <a
    href="{{ .url }}"
    class="mt-8 inline-flex items-center gap-2 text-emerald-400 transition group-hover:gap-3">

    View Project →

  </a>

</article>
