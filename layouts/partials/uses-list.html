<section class="py-28">

  <div class="mx-auto max-w-6xl px-6">

    {{ range hugo.Data.uses.categories }}

      <div class="mb-20">

        <h2 class="text-3xl font-bold text-white">

          {{ .title }}

        </h2>

        <div class="mt-8 grid gap-6 md:grid-cols-2">

          {{ range .tools }}

            <article class="rounded-xl border border-white/10 p-6">

              <h3 class="font-semibold text-white">

                {{ .name }}

              </h3>

              <p class="mt-3 text-zinc-400">

                {{ .description }}

              </p>

            </article>

          {{ end }}

        </div>

      </div>

    {{ end }}

  </div>

</section>
