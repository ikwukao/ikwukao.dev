{{ define "main" }}

<section class="section">
  <div class="container">
    {{ partial "section-header.html" (dict
      "title" "Search"
      "description" "Search projects, engineering articles, skills, and other content across ikwukao.dev."
    ) }}

    <div class="mx-auto mt-12 max-w-3xl">
      <form
        id="search-form"
        role="search"
        class="relative">
        <label
          for="search-input"
          class="sr-only">
          Search the website
        </label>

        <div class="relative">
          <svg
            class="pointer-events-none absolute left-5 top-1/2 h-5 w-5 -translate-y-1/2 text-zinc-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>

          <input
            id="search-input"
            name="q"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search projects, articles, skills..."
            aria-label="Search projects, articles, and skills"
            class="w-full rounded-2xl border border-white/10 bg-zinc-950/70 py-4 pl-14 pr-5 text-base text-white outline-none placeholder:text-zinc-600 transition focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/10">
        </div>
      </form>

      <div
        id="search-results"
        class="mt-8"
        aria-live="polite"
        aria-atomic="true">
        <p class="text-center text-sm text-zinc-500">
          Start typing to search the site.
        </p>
      </div>
    </div>
  </div>
</section>

{{ end }}
