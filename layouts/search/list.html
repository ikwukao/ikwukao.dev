{{ define "main" }}

    <p class="logo mb-5 text-xl font-bold text-emerald-500">

      >_ search

    </p>

    <h1 class="text-5xl font-bold text-white">

      Search

    </h1>

    <p class="mt-6 max-w-2xl text-zinc-400">

    </p>
