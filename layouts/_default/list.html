{{ define "main" }}

<section class="py-24">

    <div class=""mx-auto max-w-6xl px-6">
        <header class="max-w-3xl">
            <h1 class="text-5xl font-bold tracking-tight">
                {{ .Title }}
            </h1>

            {{ with .Description }}
            <p class="mt-6 text-lg leading-8 text-zinc-400">
                {{ . }}
            </p>
            {{ end }}

        </header>

        <div class="mt-16">

            {{ block "content" . }}
            {{ range .Pages }}
              <article class="border-b border-white/10 py-8">
                <h2 class="text-2xl font-semibold">
                    <a href="{{ .RelPermlink }}" class="hover:text-emerald-400">
                        {{ .Title }}
                    </a>
                </h2>

                {{ with .Summary }}
                <p class="mt-3 text-zinc-400">
                    {{ . }}
                </p>
                {{ end }}
              </article>
            {{ end }}
            {{ end }}

        </div>

    </div>

</section>

{{ end }}
